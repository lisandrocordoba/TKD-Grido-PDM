<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
  <title>TKD Buscador de Proyectos</title>
  
  <style>
    /* Estilos básicos para que no se vea feo */
    body { font-family: Arial, sans-serif; font-size: 14px; color: #333; }
    .panel-control { background: #f4f5f6; padding: 15px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 20px; }
    .btn { background: #005686; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #00446b; }
    .input-box { padding: 8px; width: 280px; border: 1px solid #ccc; border-radius: 4px; margin-right: 10px; }
    .separador { margin: 15px 0; border: none; border-top: 1px solid #ccc; }
    .item-proyecto { padding: 8px; border-bottom: 1px solid #eee; }
  </style>

  <script type="text/javascript">
    var TKDWidget = {
      spaceUrl: "https://3dspace24.teckdes.com/3dspace"
    };

    // 1. Función genérica para no repetir el código de WAFData 20 veces
    TKDWidget.consultarAPI = function(endpoint, callbackExito) {
      document.getElementById("contenedor-resultados").innerHTML = "<p>Consultando a 3DSpace... ⏳</p>";
      
      require(['DS/WAFData/WAFData'], function (WAFData) {
        WAFData.authenticatedRequest(endpoint, {
          method: 'GET',
          type: 'json',
          headers: { 'Accept': 'application/json' },
          onComplete: function (response) {
            callbackExito(response); // Si sale bien, le pasa los datos a la función que lo llamó
          },
          onFailure: function (error) {
            document.getElementById("contenedor-resultados").innerHTML = "<p style='color:red;'>Error al conectar con la API ❌</p>";
            console.error(error);
          }
        });
      });
    };

    // 2. Acción: Listar Todos
    TKDWidget.listarTodos = function() {
      var endpoint = TKDWidget.spaceUrl + "/resources/v1/modeler/projects";
      
      TKDWidget.consultarAPI(endpoint, function(response) {
        var proyectos = response.data;
        if (proyectos && proyectos.length > 0) {
          var html = "<h3>Total: " + proyectos.length + " proyectos</h3><ul>";
          for (var i = 0; i < proyectos.length; i++) {
            var props = proyectos[i].dataelements;
            html += "<li class='item-proyecto'><strong>" + props.title + "</strong><br><small style='color:#666;'>ID: " + proyectos[i].id + "</small></li>";
          }
          html += "</ul>";
          document.getElementById("contenedor-resultados").innerHTML = html;
        } else {
          document.getElementById("contenedor-resultados").innerHTML = "<p>No se encontraron proyectos.</p>";
        }
      });
    };

    // 3. Acción: Buscar por ID
    TKDWidget.buscarPorId = function() {
      var idIngresado = document.getElementById("input-id").value.trim();
      
      if (idIngresado === "") {
        alert("¡Tenés que ingresar un ID primero!");
        return;
      }

      // Le pegamos directo a la URL del ID específico
      var endpoint = TKDWidget.spaceUrl + "/resources/v1/modeler/projects/" + idIngresado;
      
      TKDWidget.consultarAPI(endpoint, function(response) {
        var proyectos = response.data;
        if (proyectos && proyectos.length > 0) {
          var props = proyectos[0].dataelements;
          var html = "<h3>Resultado:</h3>";
          html += "<div class='item-proyecto'>";
          html += "<p><strong>Nombre:</strong> " + props.title + "</p>";
          html += "<p><strong>Estado:</strong> " + props.state + "</p>";
          html += "<p><strong>Última Modificación:</strong> " + new Date(props.modified).toLocaleDateString() + "</p>";
          html += "</div>";
          document.getElementById("contenedor-resultados").innerHTML = html;
        } else {
          document.getElementById("contenedor-resultados").innerHTML = "<p>No existe ningún proyecto con ese ID.</p>";
        }
      });
    };

    // 4. El punto de arranque: Dibuja los botones vacíos
    TKDWidget.start = function () {
      var uiHTML = `
        <div class="panel-control">
          <button class="btn" onclick="TKDWidget.listarTodos()">📋 Listar Todos los Proyectos</button>
          
          <hr class="separador">
          
          <div>
            <input type="text" id="input-id" class="input-box" placeholder="Pegá el ID acá (ej: 29C5C903...)">
            <button class="btn" onclick="TKDWidget.buscarPorId()">🔍 Buscar por ID</button>
          </div>
        </div>

        <div id="contenedor-resultados">
          <p style="color: #888;">Esperando acción...</p>
        </div>
      `;
      
      widget.body.innerHTML = uiHTML;
    };

    widget.addEvent("onLoad", TKDWidget.start);
  </script>
</head>
<body>
</body>
</html>
